<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        FitBuddy
        {% endblock %}
    </title>


    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/style.css') }}"
    >

</head>


<body>


<header class="topbar">

    <a
        href="/"
        class="brand"
    >
        FitBuddy
    </a>


    <nav>

        <a href="/">
            Generate Plan
        </a>

        <a href="/view-all-users">
            Dashboard
        </a>

    </nav>

</header>


<main class="container">

    {% block content %}
    {% endblock %}

</main>


<footer>

    FitBuddy provides general wellness
    information, not medical care.

</footer>


</body>

</html>
